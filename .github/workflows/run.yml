name: Pull Periscope Ramp Ops (REP-1901) to Google Sheet

on:
  schedule:
    # All times Asia/Taipei (UTC+8, no DST, so these offsets never drift).
    # NOTE: GitHub does not run cron at the exact minute - on this repo the
    # old :00 crons were consistently firing 3-4.5 h late. Off-the-hour
    # minutes are used below because the :00/:30 slots are the busiest.
    #
    # Morning re-sync of D-1..D-7: 01:07 UTC = 09:07 Asia/Taipei.
    - cron: '7 1 * * *'
    #
    # Evening pull, target = ~45 min after FX14's scheduled departure
    # (FX14 STD from the sheet: 20:45 TPE Tue-Sat, 20:55 TPE Mon; no FX14
    # on Sundays) -> 21:30 / 21:40 Asia/Taipei.
    #
    # The cron is deliberately placed HOURS before that: GitHub's cron on
    # this repo fires 3-5 h late (measured 2026-10-19/20, e.g. the 01:07
    # UTC cron ran at 05:54 UTC), so a cron at the target minute would
    # run around 2 AM Taipei. Instead the job starts early and the script
    # itself sleeps until STD + 45 min (WAIT_FOR_STD=1, see
    # wait_until_std_plus_offset() in scrape_and_upload.py); GitHub's lag
    # just eats into that sleep. If GitHub is so late the target has
    # already passed, the job pulls immediately.
    #   09:01 UTC = 17:01 Asia/Taipei, Mon-Sat. Worst cases: on-time start
    #   -> ~4.5 h sleep; 4.5 h late -> starts right at the target.
    - cron: '1 9 * * 1-6'
    # After the pull, if FX14 has not pushed back yet, the script waits
    # 60 min inside the same job and pulls once more (WATCH_FLIGHT=14).
  workflow_dispatch:
    inputs:
      watch_flight:
        description: 'Departure flight to wait for (e.g. 14). Leave empty for a plain one-shot pull.'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Evening job = up to ~4.5 h hold + scrape + optional 60-min wait +
    # second scrape; GitHub's hard cap per job is 360 min.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape and upload
        env:
          # Stream prints to the log as they happen (otherwise Python buffers
          # stdout on Actions and nothing shows until the step ends).
          PYTHONUNBUFFERED: '1'
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
          # Only the evening cron entry watches FX14 (and holds until STD+45);
          # the morning cron and manual runs (unless the input is filled)
          # are one-shot.
          WATCH_FLIGHT: ${{ (github.event_name == 'schedule' && github.event.schedule == '1 9 * * 1-6') && '14' || inputs.watch_flight }}
          WAIT_FOR_STD: ${{ (github.event_name == 'schedule' && github.event.schedule == '1 9 * * 1-6') && '1' || '' }}
        run: python scrape_and_upload.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
