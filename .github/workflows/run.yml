name: Pull Periscope Ramp Ops (REP-1901) to Google Sheet

on:
  schedule:
    # Twice a day, Asia/Taipei time (UTC+8, no DST - so this offset is
    # constant year-round, no seasonal cron drift):
    #   23:00 UTC = 07:00 Asia/Taipei the following calendar day
    - cron: '0 23 * * *'
    #   11:00 UTC = 19:00 (7:00 PM) Asia/Taipei the same calendar day
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape and upload
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
        run: python scrape_and_upload.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
