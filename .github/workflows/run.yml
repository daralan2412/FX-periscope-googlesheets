name: Pull Periscope Ramp Ops (REP-1901) to Google Sheet

on:
  schedule:
    # Twice a day, Asia/Taipei time (UTC+8, no DST - so this offset is
    # constant year-round, no seasonal cron drift):
    #   01:00 UTC = 09:00 Asia/Taipei the same calendar day
    - cron: '0 1 * * *'
    #   13:00 UTC = 21:00 (9:00 PM) Asia/Taipei the same calendar day
    #   (moved from 07:00/19:00 on 2026-09-04: the evening run is the one
    #   that captures D0, and TPE missions run ~17:00-21:00 local, so 21:00
    #   catches most of the day's rows; the morning run re-syncs D-1.)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape and upload
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
        run: python scrape_and_upload.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
